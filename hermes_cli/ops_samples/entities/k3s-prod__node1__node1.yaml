# node1 —— 阿里云 k3s 集群控制平面节点（2026-08-08 实测）。
name: node1
type: k8s-node
env: prod
cluster: k3s-prod
role: control-plane
endpoint: "203.0.113.10"
attrs:
  internal_ip: 203.0.113.13
  public_ip: 203.0.113.10
  spec: ecs.e-c1m2.xlarge
  k8s_version: v1.28.15
  memory_gb: 8
  disk: "cloud_essd_entry 40G (13G used, 31%)"
  distro: k3s
  # 连接方式见 topology.yaml hosts 行的 credential 引用（样例为占位符）
  maintenance_window: "周日 02:00-04:00（示例，待调整）"
  verified_via: terraform.tfstate
depends_on: []
depended_by: [k3s-prod]
ops:
  healthcheck: "kubectl get node node1"
