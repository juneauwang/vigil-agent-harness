# k3s-prod —— 生产 k3s 集群（2026-08-08 实测更新）。
name: k3s-prod
type: k8s
env: prod
cluster: k3s-prod
endpoint: "https://203.0.113.10:6443"
attrs:
  distro: k3s
  version: v1.28.15
  nodes: ["node1 (control-plane, 203.0.113.13, 8G)", "node2 (worker, 203.0.113.14)"]
  network: "203.0.113.0/24"
  ingress: traefik
  workloads: [argo, argocd, gitea, harbor, dwarf-village-dev, dwarf-village-prod, istio-bookinfo, its-mytabs]
depends_on: [harbor]
depended_by: [argocd]
ops:
  healthcheck: "kubectl get nodes"
