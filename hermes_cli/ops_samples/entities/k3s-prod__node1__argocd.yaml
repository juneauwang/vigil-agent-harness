# argocd —— GitOps 发布（样例值请按实际核对）。
name: argocd
type: service
env: prod
cluster: k3s-prod
attrs:
  namespace: argocd
  # 对外地址待核对（NodePort/LB），确认后补 endpoint
depends_on: [k3s-prod]
depended_by: [gateway-svc]                # gateway-svc 由 argocd 发布
ops:
  healthcheck: "kubectl -n argocd get applications"
