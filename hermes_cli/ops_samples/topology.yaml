# topology.yaml —— 第一层：平台拓扑总览（session 启动注入 system prompt，保持 <50 行）
# 203.0.113.10 集群样例（schema v0.2，见 ops-agent-harness.md §2.2）；投入前请逐项核对。
# 第一层 = 总览：hosts（每行一台机器，runtime 是 host 属性）+ cross_host（跨 host
# 实体：k3s 集群 / ingress 等不服从"服务挂单机"树形模型的实体）。
# 第二层服务索引在 hosts/<hostname>.yaml；第三层完整档案在 entities/<name>.yaml。
version: 2
updated_at: 2026-08-12
sources: [terraform.tfstate, agent, manual, discovered]
environments:
  - name: prod
    entry: "ssh user@203.0.113.10"
    isolation: strict
    role: prod
  - name: test
    entry: "ssh test-jump"
    isolation: relaxed
    role: test
hosts:
  - {name: node1, env: prod, endpoint: "203.0.113.10", role: control-plane, runtime: k3s, owner: your-name, source: agent, last_verified: 2026-08-08, services_index: hosts/node1.yaml}
  - {name: node2, env: prod, role: worker, runtime: k3s, owner: your-name, source: agent, last_verified: 2026-08-08, services_index: hosts/node2.yaml}
  - {name: test-host, env: test, runtime: docker, owner: your-name, source: manual, last_verified: 2026-08-06, services_index: hosts/test-host.yaml}
cross_host:
  - {name: k3s-prod, type: k8s, env: prod, endpoint: "https://203.0.113.10:6443", owner: your-name, source: manual, last_verified: 2026-08-06, detail: entities/k3s-prod.yaml}
  - {name: ingress, type: ingress, env: prod, owner: your-name, source: manual, last_verified: 2026-08-08, detail: entities/ingress.yaml}
key_paths:
  - [ingress, gateway-svc, order-db]
