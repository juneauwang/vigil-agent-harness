<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Vigil Console</title>
    <style>
      /* 字体由 /src/index.css 的 @font-face 本地加载（web/public/fonts/，无 CDN）；
         此处兜底背景色避免首帧白屏。 */
      html { background: #f4f6fb; }
      html[data-theme='dark'] { background: #070b14; }
    </style>
    <script>
      /* Apply the saved theme before React mounts to avoid a light flash. */
      try {
        if (localStorage.getItem('vigil-console-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) { /* storage unavailable */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
