version: 1
updated_at: 2026-08-06
sources: [netbox, snipeit, agent]           # 实际启用同步源（当前 agent + 人工）
environments:
  - name: prod
    entry: "ssh jump@39.106.217.32"
    isolation: strict                       # strict = 跨环境操作需审批
    role: prod
    core_entities: [harbor, k3s-prod, argocd]
